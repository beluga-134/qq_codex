[package]
name = "retro-messenger"
version = "0.1.0"
description = "A retro OICQ and MSN inspired messenger"
authors = ["you"]
edition = "2021"

[lib]
name = "retro_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
portable-pty = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned to the version exposed by Tauri 2.11.5's platform webview handle.
webkit2gtk = "=2.0.2"
